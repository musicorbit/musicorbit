<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mo-ring" x1="8" y1="50" x2="56" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="52%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="mo-disc" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27222d" />
      <stop offset="100%" stop-color="#111018" />
    </linearGradient>
    <radialGradient id="mo-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
  </defs>
  <!-- Background badge -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="#11101b" stroke="url(#mo-ring)" stroke-opacity="0.45" stroke-width="1.5" />
  <!-- Back orbital arc -->
  <ellipse cx="32" cy="32" rx="23" ry="9.5" transform="rotate(-28 32 32)" stroke="url(#mo-ring)" stroke-width="2.2" stroke-opacity="0.35" />
  <!-- Vinyl disc -->
  <circle cx="32" cy="32" r="15.5" fill="url(#mo-disc)" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.4" />
  <!-- Vinyl grooves -->
  <circle cx="32" cy="32" r="11.5" stroke="#fbbf24" stroke-opacity="0.22" stroke-width="1" />
  <circle cx="32" cy="32" r="8.5" stroke="#fbbf24" stroke-opacity="0.16" stroke-width="0.9" />
  <!-- Center amber label -->
  <circle cx="32" cy="32" r="5.2" fill="url(#mo-core)" />
  <circle cx="32" cy="32" r="1.7" fill="#0d0b14" />
  <!-- Front orbital sweep -->
  <path d="M12.2 42.5C16.2 47.4 28.4 45.6 39.8 39.5C51.2 33.4 56.6 25.6 52.2 21.3" stroke="url(#mo-ring)" stroke-width="2.6" stroke-linecap="round" />
  <!-- Orbiting golden satellite -->
  <circle cx="49.5" cy="22.8" r="3" fill="#fde047" />
  <circle cx="49.5" cy="22.8" r="5.5" fill="#f59e0b" fill-opacity="0.28" />
</svg>
