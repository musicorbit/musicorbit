name: Bug Report
description: Report a bug or unexpected behavior in MusicOrbit.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MusicOrbit version
      placeholder: "e.g. v0.1.0 (Docker latest)"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose (GHCR image)
        - Docker (built from source)
        - Bare-metal Node.js
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Browser or OpenSubsonic app (if applicable)
      placeholder: "e.g. Safari on iOS, Chrome Desktop, Arpeggi, Symfonium, Amperfy"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any relevant container logs or Activity Log entries (redact passwords/API keys).
      render: shell
