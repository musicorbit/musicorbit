  <rect x="86" y="562" width="132" height="26" rx="13" fill="rgba(245,158,11,0.16)" stroke="rgba(245,158,11,0.4)"/>
  <text x="104" y="579" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#fde68a">SYNCED .LRC</text>

  <text x="486" y="168" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="700" fill="#52525b">Golden light across the quiet skyline</text>
  <text x="486" y="232" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="700" fill="#71717a">Drifting slowly through the midnight air</text>
  <text x="486" y="304" font-family="Inter,system-ui,sans-serif" font-size="30" font-weight="800" fill="#fde68a">Every signal finds its orbit tonight</text>
  <rect x="486" y="320" width="220" height="3" rx="1.5" fill="#f59e0b"/>
  <text x="486" y="382" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="700" fill="#a1a1aa">Warm reflections echo in the dark</text>
  <text x="486" y="446" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="700" fill="#71717a">Hold the frequency until the dawn arrives</text>
  <text x="486" y="510" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="700" fill="#52525b">Spinning weightless on a silver wave</text>

