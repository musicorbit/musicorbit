name: Publish Docker Image (GHCR)

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push Multi-Arch Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/musicorbit/musicorbit
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=MusicOrbit
            org.opencontainers.image.description=Self-hosted, open-source music library, lossless browser player, synced lyrics, and metadata hub
            org.opencontainers.image.url=https://musicorbit.app
            org.opencontainers.image.documentation=https://musicorbit.app/what-is-musicorbit/
            org.opencontainers.image.source=https://github.com/musicorbit/musicorbit
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push linux/amd64 + linux/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
